<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meddawatta Hostel Food Order</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #fdfbf7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Mobile App Container Layout */
        .app-container {
            width: 100%;
            max-width: 420px; /* සාමාන්‍ය Mobile Phone එකක පළල */
            height: 100vh;
            background: linear-gradient(135deg, #4a2c11 0%, #2e1a08 100%); /* Ruhuna University Brown Theme */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 25px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
            color: white;
        }

        /* ඉහළ සහ පහළ ඇති අලංකාර කහ පැහැති හැඩතල (Decorative Shapes) */
        .app-container::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 200px;
            height: 200px;
            background: rgba(255, 193, 7, 0.15); /* Ruhuna Yellow */
            border-radius: 50%;
            filter: blur(20px);
        }

        .app-container::after {
            content: '';
            position: absolute;
            bottom: -80px;
            left: -80px;
            width: 250px;
            height: 250px;
            background: rgba(255, 193, 7, 0.1);
            border-radius: 50%;
            filter: blur(30px);
        }

        /* Header UI Elements */
        .brand-section {
            margin-top: 40px;
            z-index: 1;
        }

        .uni-badge {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 1px solid rgba(255, 193, 7, 0.3);
            display: inline-block;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            line-height: 1.3;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        h1 span {
            color: #ffc107; /* Highlighted Yellow text */
        }

        /* Center Animation / Icon Area */
        .illustration-section {
            width: 160px;
            height: 160px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed rgba(255, 193, 7, 0.4);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 70px;
            box-shadow: inset 0 0 20px rgba(255,193,7,0.1);
            animation: pulse 3s infinite alternate;
            z-index: 1;
        }

        @keyframes pulse {
            0% { transform: scale(1); border-color: rgba(255, 193, 7, 0.4); }
            100% { transform: scale(1.05); border-color: rgba(255, 193, 7, 0.8); }
        }

        /* Bottom UI Elements & Button */
        .action-section {
            width: 100%;
            margin-bottom: 30px;
            z-index: 1;
        }

        .hostel-tag {
            font-size: 15px;
            color: #dddddd;
            margin-bottom: 25px;
            font-weight: 400;
        }

        .btn-go {
            width: 100%;
            background: linear-gradient(90deg, #ffc107 0%, #ff9800 100%);
            color: #2e1a08;
            padding: 16px;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.4);
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .btn-go:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 152, 0, 0.6);
        }

        .btn-go:active {
            transform: translateY(1px);
        }

        .btn-go .arrow {
            font-size: 20px;
            transition: transform 0.3s ease;
        }

        .btn-go:hover .arrow {
            transform: translateX(5px);
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="brand-section">
            <span class="uni-badge">University of Ruhuna</span>
            <h1>Meddawatta Hostel<br><span>Food Order</span></h1>
        </div>

        <div class="illustration-section">
            🍱
        </div>

        <div class="action-section">
            <p class="hostel-tag">ඔබගේ දෛනික ආහාර වේල පහසුවෙන්ම වෙන්කරවා ගන්න.</p>
            <a href="login.php" class="btn-go">
                LET'S GO <span class="arrow">➔</span>
            </a>
        </div>

    </div>

</body>
</html>
